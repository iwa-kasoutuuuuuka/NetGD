[package]
name = "fatmap"
description = "Pure FAT32 helpers for the firmware's track-file lookup: VFAT long-name matching and cluster-chain to block-run (extent) mapping, shared by the firmware and the host tests"
version = "0.1.0"
edition = "2021"

[features]
# Let the firmware log these types. Off by default so the host tests do not
# need defmt.
defmt = ["dep:defmt"]
# FAT16 volumes in the `vol`/`dir` reader (fixed root directory, 16-bit FAT).
# Off: such a card does not mount. Undecided whether the firmware keeps them.
fat16 = []

[dependencies]
defmt = { version = "0.3", optional = true }

[dev-dependencies]
# The FAT reader the firmware links today (mcu/netgd/Cargo.toml), used by the
# host tests as the oracle for this crate's reader. Not a dependency of the
# library.
embedded-sdmmc = { version = "=0.9.0", default-features = false }
