[package]
name = "netgd"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
embedded-hal = "0.2"
cortex-m = { version = "0.7.6", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.0"
panic-probe = { version = "0.3", features = ["print-defmt"] }
critical-section = "1.1"
static_cell = "2"
gamecfg = { path = "../../common/gamecfg", features = ["defmt"] }
lzma = { path = "../../common/lzma" }
psload = { path = "../../common/psload", features = ["defmt"] }
discimg = { path = "../../common/discimg", features = ["defmt"] }
# FAT32 long-name matching and cluster-chain mapping (pure, host-tested).
fatmap = { path = "../../common/fatmap", features = ["defmt"] }
# Pure logic for the sd-multiblock / sd-highspeed features. Optional, so the
# default build does not even see it.
sdfast = { path = "../../common/sdfast", optional = true }
# Stack high-water mark scan and reply layout (feature `stack-hw`; pure,
# host-tested).
stackmark = { path = "../../common/stackmark", optional = true }
# Frame decoder for the `pinfind` feature (pure, host-tested).
pinfind = { path = "../../common/pinfind", optional = true, features = ["defmt"] }

embassy-atsam3 = { path = "../embassy-atsam3", features = ["rt", "time-driver"] }
# The resident boot region's pure logic. In the app: the clock constants
# (resident-app-contract.md N3) and, with `resident`, the GPBR1 report and
# the information block it reads.
bootcore = { path = "../bootcore" }
embassy-time = "0.5"
embassy-futures = "0.1"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }

defmt = "0.3"
defmt-rtt = "0.4"

embedded-sdmmc = { version = "0.9", default-features = false, features = ["defmt-log"] }
heapless = { version = "0.8", features = ["defmt-03"] }


[features]
# Which board this firmware is for. Exactly one; `board-v55` is the default,
# so `--no-default-features` is needed to build the other.
#
# board-v55: GDEMU v5.5 and the v5.15b clones. SAM3U4E (or a 2E, with
#   `sam3u2e` on top) and a Cyclone II. The bitstream is
#   fpga/Quartus/output_files/OpenGDEMU.rbf, LZMA-packed into the image.
# board-v60: GDEMU 6.0 and its clones. SAM3U2E and an AGM AG16K. The
#   bitstream is the optional fpga/agm/output/OpenGDEMU_ag16k.rbf. There is
#   none yet, and its absence is NOT a build error: the image is built
#   without one and the loader reports `NoBitstream` at boot (LED: 5 blinks).
#   Build as
#     DEFMT_LOG=off cargo build --release --no-default-features --features board-v60
#   The five loader pins are the v5.5 ones, unconfirmed on 6.0: see
#   `cyclone::pinmap`.
default = ["board-v55", "lazy-extents"]
board-v55 = []
board-v60 = ["sam3u2e", "lazy-extents"]

# GDEMU 6.0 pin-finder (docs/design/g1-ag16k-port.md 2-4 method 2,
# fpga/pinfind/README_ja.md). NOT a NetGD firmware: it loads the pin-finder
# bitstream (fpga/pinfind/output/pinfind_ag16k.rbf, embedded like the
# board-v60 one and optional the same way), turns every MCU line except the
# five PS lines into an input with pull-up, and reports over RTT which FPGA
# ball arrives on which MCU pin. No SD, no IDE, no LED, and `init` sets up no
# SMC / UART / PCK0 / HSMCI pins (embassy-atsam3 `no-board-io`). Keep the
# logging on:
#   cargo build --release --no-default-features --features pinfind
# Off by default; the other builds do not change. Not run on hardware.
pinfind = ["board-v60", "dep:pinfind", "embassy-atsam3/no-board-io"]

# Read a track file that is too fragmented for the shared extent pool
# through a small on-demand window over its cluster chain (fat.rs, `lazy_*`),
# instead of through embedded-sdmmc one 512-byte CMD17 at a time. About 1.1 KB
# of flash and 0.7 KB of RAM; on by default and in `board-v60`. Without it such
# a track still plays, slowly, as before -- build with
# `--no-default-features --features board-v55,...` to win the flash back (the
# 2E `resident,sd-fast` image needs it, docs/research/g3-read-path.md).
lazy-extents = []

# board-v60 only: send each byte MSB first instead of LSB first. The AG16K's
# PS bit order is inferred, not measured (docs/research/ag16k-config.md 2-3):
# LSB first is right for the .rbf, MSB first for the .bin. If the board never
# reaches CONF_DONE with a good file, try the other one before blaming wiring.
ps-msb-first = []

# Target the SAM3U2E instead of the 4E: one 128 K flash plane instead of two,
# and 16 K of SRAM0 instead of 32 K. Selects `link/sam3u2e.x` (see build.rs),
# moves `cdda::RING` into the otherwise-unused NFC SRAM.
# Build it as `DEFMT_LOG=off cargo build --release --features sam3u2e`; the
# logging code is part of what has to come out to fit.
sam3u2e = ["embassy-atsam3/sam3u2e"]

# Link the application for the resident boot region (design: docs/design/
# fw-bootloader.md 2-5, option B-SD; format: tools/fwimage/FORMAT.md "Format
# 3"): at 0x00082000 behind the 8 KB resident instead of at 0x00080000, with
# the "NGAP" descriptor `.app_desc` at 0x00082100, the 4-byte `.image_crc`
# trailer ending the image on a 512-byte boundary, VTOR written before `main`,
# and clock init that accepts the clocks the resident already set up.
# Selects `link/<part>_resident.x`. Without it the image is byte-for-byte the
# one built before this feature existed. Works with every other feature:
#   cargo build --release --features resident
#   DEFMT_LOG=off cargo build --release --no-default-features --features board-v60,resident
# Seal for flashing with `python tools/fwimage/fwimage.py seal <elf> -o <elf>`.
resident = ["embassy-atsam3/resident"]

# SD read-path speed-ups for G3-4 (docs/research/g3-read-path.md). All are off
# by default and neither has run on hardware: the default image is byte for
# byte the one built without them. They are separate so a regression can be
# bisected on the board. `sd-fast` turns on all three.
#
# sd-multiblock: sequential read-ahead. After a CD_READ that continues the
#   previous one (a streaming host), the next sectors are fetched with CMD18
#   into the idle CD_READ_BUF, so the next request's first chunk is a cache
#   hit and carries no card latency. No extra RAM.
# sd-highspeed: SD High-Speed mode. At init, CMD6 to switch the card, then
#   HSMCI HSMODE and a 48 MHz clock (24 MHz otherwise), verified by reading
#   real data back; any failure backs out to 24 MHz.
sd-multiblock = ["dep:sdfast"]
sd-highspeed = ["dep:sdfast"]
#
# fast-complete: complete a DMA CD_READ as soon as the host has been seen to
#   drain the FIFO, instead of after a fixed 100 ms floor (ide.rs,
#   `stream_from_sd`). Not an SD feature, but the largest per-request latency
#   in the read path. The floor exists because an empty FIFO can also mean the
#   host has not started; see the comment there for what that cost.
fast-complete = []
sd-fast = ["sd-multiblock", "sd-highspeed", "fast-complete"]

# CD_READ with data select 0x1_ (byte 1 = 0x10) returns the whole 2,352-byte
# sector, as stock GDEMU 6.0 does (D10, docs/research/d10-d14-raw-sectors.md):
# a GDI's 2,352-byte track as stored, a CDI's 2,336-byte track behind a
# generated sync + header. Other data reads keep answering 2,048 bytes. (Audio
# tracks answer 0x20 / 0x10 with their 2,352-byte PCM sectors in every build,
# as stock does, R144; this feature only adds the data tracks.) Off by
# default and not run on hardware: transfers stop being multiples of 2,048
# bytes, and the read path (DMA, PIO blocks, staging) has broken on hardware
# before (R72). Check it with gdprobe (label=netgd) before making it default.
raw-sectors = []

# CD_READ 0x20 over a CDI's Mode 2 Form 2 sectors (the postgap mkdcdisc
# writes after the data track) returns their 2,324 data bytes each, as stock
# GDEMU 6.0 does (D14, docs/research/d10-d14-raw-sectors.md). Only a request
# that fits one staging round of a mapped track and whose sectors are all
# Form 2 (the subheaders are read first); a read mixing Form 1 and Form 2,
# 0x28, and unmapped tracks keep 2,048 bytes (stock's answer not recorded).
# Off by default and not run on hardware: 2,324-byte transfers, like
# raw-sectors' 2,352, are not multiples of 2,048 (R72). gdprobe's seek test
# hits the postgap of images 04/05.
form2-sectors = []

# SD throughput benchmark at boot. Off by default: it takes ~6 s, which
# delays the IDE task spawn past the point the DC starts issuing ATAPI
# commands, and the console times out with a CDB-DRQ error.
# Build with `cargo build --release --features sd-bench` to measure.
sd-bench = []
# Log the card's root directory (two levels) at boot. Debug only: ~2.5 KB
# of flash and extra boot time even with DEFMT_LOG=off (LOG R81).
sd-list = []

# Measure the stack's high-water mark on the board (docs/PLAN.md A-1).
# `main` paints the free stack (from `__sheap` up to just below its own SP)
# with 0xC5C5C5C5 right after the clock init, and `0xE0` sub-command 9
# (STACK) scans for the deepest word that lost the paint and returns
# {format, reserved, used, unpainted} (common/stackmark). VERSION's feature
# byte gets bit 3. Off by default: it adds ~0.2 ms of RAM writes at boot and
# some flash, and has not run on hardware. Works with every other feature:
#   DEFMT_LOG=off cargo build --profile release-z --features sam3u2e,resident,sd-fast,stack-hw
# Read it with the netgd-menu info screen (X) or netgd-recv's NGD:STACK line.
stack-hw = ["dep:stackmark"]

# Once-a-second FPGA liveness line on the UART. Off by default: uart_println!
# is unsynchronized, so it interleaves mid-word with the IDE task's per-command
# tracing and corrupts both streams.
fpga-diag = []

# Serve CD_READ data as an incrementing 16-bit word counter instead of real
# disc content. A checksum only says "the payload differs"; a counter says how
# -- a repeated value is a duplicated word (the FIFO did not advance in time),
# a skipped value is a dropped word. Diagnostic builds only.
dma-pattern = []

[profile.dev]
debug = 2

[profile.release]
debug = 2
opt-level = "s"
lto = "fat"
codegen-units = 1

# Opt-in size profiles (docs/research/flash-budget-2e.md section 7). Nothing
# selects them by default: `cargo build --release` is unchanged. Build with
#   DEFMT_LOG=off cargo build --profile release-z --features sam3u2e,resident,sd-fast
# The output lands in target/thumbv7m-none-eabi/release-z/netgd. opt-level "z"
# trades speed for size and has NOT been timed on hardware (IDE command
# response, CD_READ DMA, CDDA tick, LZMA/FPGA start-up).
[profile.release-z]
inherits = "release"
opt-level = "z"

# Same, but the timing-sensitive support crates stay at "s": the LZMA decoder
# (FPGA start-up time), the SAM3U HAL (CDDA tick, DMA) and the PS loader.
[profile.release-z-hot-s]
inherits = "release-z"

[profile.release-z-hot-s.package.lzma]
opt-level = "s"

[profile.release-z-hot-s.package.embassy-atsam3]
opt-level = "s"

[profile.release-z-hot-s.package.psload]
opt-level = "s"
