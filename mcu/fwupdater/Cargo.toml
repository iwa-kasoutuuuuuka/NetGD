[package]
name = "fwupdater"
description = "Standalone RAM-resident flash writer, embedded into the firmware as a raw blob"
version = "0.1.0"
edition = "2021"

# The pure decisions (header checks, vector checks, CRC) live in a library so
# they can be tested on the host; see src/logic.rs.
[lib]
name = "fwupdater_logic"
path = "src/logic.rs"

[[bin]]
name = "fwupdater"
path = "src/main.rs"
test = false
bench = false

[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# No unwinder, and no landing pads to pull one in.
panic = "abort"

[features]
# A board with the resident boot region (docs/design/fw-bootloader.md): the
# updater then accepts OGFW format 3 only (app at APP_BASE, descriptor and
# trailer CRC). Off: format 2 only, exactly what ships today. main.rs does not
# use the format-3 pieces yet (stage S5); `cargo test --lib --features resident`
# runs the host tests of both.
resident = []
