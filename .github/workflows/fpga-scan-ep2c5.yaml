name: Build FPGA scan core (EP2C5F256)

# Builds the scan core fpga/scan-ep2c5 (tri-state outputs only on the 16
# MCU_DATA balls, enabled while NCS3 and NRD are low; every other user I/O
# an input with weak pull-up ON, clock-input balls without; no PLL) for
# EP2C5F256C8 with Quartus II 13.0 SP1, then runs
# tools/pinfind/ep2c5gate.py --scan on the fitter's .pin and fit.rpt. The
# bitstream is uploaded only if the gate passes. The wrapper and qsf are
# generated by tools/pinfind/mk_scan.py (a unit test checks they are up to
# date); scan_core.v is hand-written and checked with Icarus Verilog
# (fpga/scan-ep2c5/tb/tb_scan.v). Address map: docs/research/ep2c5-scan.md.
#
# ARTIFACTS ONLY: the .rbf is never committed. Not hardware-verified.
# Image resolution and fallback are the same as fpga-stage0-ep2c5.yaml.

on:
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Quartus image to use. Default is this repository's own
          ghcr.io/<owner>/<repo>/quartus2:latest (lower-cased).
        required: false
        default: ''
  push:
    paths:
      - 'fpga/scan-ep2c5/**'
      - 'fpga/stage0-ep2c5/stage0.qsf'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_scan.py'
      - 'tools/pinfind/ep2c5_scan.csv'
      - 'tools/pinfind/ep2c5_padmap.csv'
      - 'tools/pinfind/ep2c5f256_balls.txt'
      - 'tools/pinfind/tests/test_ep2c5_scan.py'
      - '.github/workflows/fpga-scan-ep2c5.yaml'
  pull_request:
    paths:
      - 'fpga/scan-ep2c5/**'
      - 'fpga/stage0-ep2c5/stage0.qsf'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_scan.py'
      - 'tools/pinfind/ep2c5_scan.csv'
      - 'tools/pinfind/ep2c5_padmap.csv'
      - 'tools/pinfind/ep2c5f256_balls.txt'
      - 'tools/pinfind/tests/test_ep2c5_scan.py'
      - '.github/workflows/fpga-scan-ep2c5.yaml'

jobs:
  unit-tests:
    name: Gate + generator unit tests, core simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -m unittest -v tools/pinfind/tests/test_ep2c5gate.py \
            tools/pinfind/tests/test_ep2c5_pullcode.py tools/pinfind/tests/test_ep2c5_scan.py
      - name: Icarus Verilog testbench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          iverilog -g2005 -o tb.out fpga/scan-ep2c5/tb/tb_scan.v fpga/scan-ep2c5/scan_core.v
          timeout 300 vvp -n tb.out | tee tb.txt
          grep -q '^TB PASS' tb.txt

  quartus-compile:
    name: Quartus II 13.0 SP1 compile + gate (scan)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Reclaim Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and pull image
        id: img
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/quartus2:latest"
          fi
          echo "Using $image"
          if ! docker pull "$image"; then
            image="ghcr.io/cepawiel/opengdemu/quartus2:latest"
            echo "Falling back to $image"
            docker pull "$image"
          fi
          # :latest is a moving tag: record what it resolved to.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Quartus image"
            echo "- image: \`$image\`"
            echo "- resolved digest: \`$digest\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage sources
        run: |
          mkdir -p "$RUNNER_TEMP/work/project"
          cp fpga/scan-ep2c5/scan.qpf fpga/scan-ep2c5/scan.qsf fpga/scan-ep2c5/scan.v \
             fpga/scan-ep2c5/scan_core.v fpga/scan-ep2c5/scan.sdc "$RUNNER_TEMP/work/project/"

      - name: Compile (quartus_sh --flow compile)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          # --user 0: the image ends on USER ubuntu (uid 1000), which cannot
          # write the runner's bind mount.
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/work:/build" \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -c 'cd /build/project && quartus_sh --flow compile scan'

      - name: Collect outputs, size, SHA-256, header
        if: always()
        run: |
          mkdir -p dist
          o="$RUNNER_TEMP/work/project/output_files"
          ls -la "$o" || true
          cp "$o"/scan.* dist/ 2>/dev/null || true
          rm -f dist/scan.sof dist/scan.pof
          test -f dist/scan.rbf || { echo "::error::no scan.rbf produced"; exit 1; }
          size=$(stat -c %s dist/scan.rbf)
          sha=$(sha256sum dist/scan.rbf | cut -d' ' -f1)
          {
            echo "### scan.rbf (EP2C5F256C8)"
            echo "- size: $size bytes"
            echo "- sha256: \`$sha\`"
            echo '```'; od -A x -t x1 -N 64 dist/scan.rbf; echo '```'
            echo "### fit.summary"; echo '```'; cat dist/scan.fit.summary 2>/dev/null; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== warnings"
          grep -h "^Warning" dist/*.rpt || true
          echo "== critical warnings"
          grep -h "^Critical Warning" dist/*.rpt || true
          echo "== ignored assignments (fit.rpt)"
          awk '/^; Ignored Assignments/{p=1} p&&/^$/{exit} p' dist/scan.fit.rpt || true

      - name: Scan core gate
        # `shell: bash` adds -o pipefail, so the gate's exit status survives tee.
        shell: bash
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          rbf=dist/scan.rbf
          {
            echo "image: $IMAGE"
            echo "image digest: $DIGEST"
            echo "scan.rbf size: $(stat -c %s "$rbf") bytes"
            echo "scan.rbf sha256: $(sha256sum "$rbf" | cut -d' ' -f1)"
          } > gate.txt
          python3 tools/pinfind/ep2c5gate.py dist/scan.pin --fit dist/scan.fit.rpt \
            --scan --table tools/pinfind/ep2c5_scan.csv --rbf "$rbf" | tee -a gate.txt
          { echo "### ep2c5gate --scan"; echo '```'; head -n 5 gate.txt; tail -n 40 gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bitstream
        # Only a bitstream that passed the gate is published.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scan-ep2c5-rbf
          path: dist/scan.rbf
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-ep2c5-reports
          path: |
            dist/*.summary
            dist/*.rpt
            dist/*.pin
            dist/*.smsg
            dist/*.done
            gate.txt
          if-no-files-found: ignore
