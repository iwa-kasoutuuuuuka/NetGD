name: Build FPGA scan2 core (EP2C5F256, v0..v2)

# Builds the scan2 core fpga/scan2-ep2c5 (scan_core unchanged + the g1x
# input-only G1 discrimination block; Run A of
# docs/research/ag16k-ps-plan-run4.md) in its three I/O variants:
#   v0  as scan (weak pull-up ON on every user I/O input)
#   v1  weak pull-up OFF on the 33 DC_* balls and C4 / C5
#   v2  bus hold ON, weak pull-up OFF on the 33 DC_* balls
# for EP2C5F256C8 with Quartus II 13.0 SP1, then runs
# tools/pinfind/ep2c5gate.py --scan2 K on each fitter's .pin and fit.rpt
# (outputs only on the 16 MCU_DATA balls, no PLL, pull-up / bus hold per
# variant, stage-0 device options). A bitstream is uploaded only if its
# gate passes. The wrapper, tables and qsfs are generated by
# tools/pinfind/mk_scan2.py (a unit test checks they are up to date);
# scan2_core.v / g1x.v are hand-written and checked with Icarus Verilog
# (fpga/scan2-ep2c5/tb/tb_scan2.v, including a scan_core regression).
# Register map: docs/research/ep2c5-scan2.md.
#
# ARTIFACTS ONLY: the .rbf is never committed. Not hardware-verified.
# Image resolution and fallback are the same as fpga-scan-ep2c5.yaml.

on:
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Quartus image to use. Default is this repository's own
          ghcr.io/<owner>/<repo>/quartus2:latest (lower-cased).
        required: false
        default: ''
  push:
    paths:
      - 'fpga/scan2-ep2c5/**'
      - 'fpga/scan-ep2c5/scan_core.v'
      - 'fpga/stage0-ep2c5/stage0.qsf'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_scan.py'
      - 'tools/pinfind/mk_scan2.py'
      - 'tools/pinfind/ep2c5_scan.csv'
      - 'tools/pinfind/ep2c5_scan2_v*.csv'
      - 'tools/pinfind/ep2c5_padmap.csv'
      - 'tools/pinfind/ep2c5f256_balls.txt'
      - 'tools/pinfind/tests/test_ep2c5_scan2.py'
      - '.github/workflows/fpga-scan2-ep2c5.yaml'
  pull_request:
    paths:
      - 'fpga/scan2-ep2c5/**'
      - 'fpga/scan-ep2c5/scan_core.v'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_scan2.py'
      - 'tools/pinfind/ep2c5_scan2_v*.csv'
      - '.github/workflows/fpga-scan2-ep2c5.yaml'

jobs:
  unit-tests:
    name: Gate + generator unit tests, core simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -m unittest -v tools/pinfind/tests/test_ep2c5gate.py \
            tools/pinfind/tests/test_ep2c5_pullcode.py tools/pinfind/tests/test_ep2c5_scan.py \
            tools/pinfind/tests/test_ep2c5_scan2.py
      - name: Icarus Verilog testbenches (scan, scan2)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          iverilog -g2005 -o tb.out fpga/scan-ep2c5/tb/tb_scan.v fpga/scan-ep2c5/scan_core.v
          timeout 300 vvp -n tb.out | tee tb.txt
          grep -q '^TB PASS' tb.txt
          iverilog -g2005 -o tb2.out fpga/scan2-ep2c5/tb/tb_scan2.v \
            fpga/scan2-ep2c5/scan2_core.v fpga/scan2-ep2c5/g1x.v fpga/scan-ep2c5/scan_core.v
          timeout 900 vvp -n tb2.out | tee tb2.txt
          grep -q '^TB PASS' tb2.txt
          { echo "### tb_scan2"; echo '```'; cat tb2.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  quartus-compile:
    name: Quartus II 13.0 SP1 compile + gate (scan2 v${{ matrix.variant }})
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant: [0, 1, 2]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Reclaim Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and pull image
        id: img
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/quartus2:latest"
          fi
          echo "Using $image"
          if ! docker pull "$image"; then
            image="ghcr.io/cepawiel/opengdemu/quartus2:latest"
            echo "Falling back to $image"
            docker pull "$image"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Quartus image"
            echo "- image: \`$image\`"
            echo "- resolved digest: \`$digest\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage sources (variant v${{ matrix.variant }})
        env:
          K: ${{ matrix.variant }}
        run: |
          p="$RUNNER_TEMP/work/project"
          mkdir -p "$p"
          cp fpga/scan2-ep2c5/scan2.qpf fpga/scan2-ep2c5/scan2.v fpga/scan2-ep2c5/scan2_core.v \
             fpga/scan2-ep2c5/g1x.v fpga/scan2-ep2c5/scan2.sdc fpga/scan-ep2c5/scan_core.v "$p/"
          cp "fpga/scan2-ep2c5/scan2_v$K.qsf" "$p/scan2.qsf"

      - name: Compile (quartus_sh --flow compile)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/work:/build" \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -c 'cd /build/project && quartus_sh --flow compile scan2'

      - name: Collect outputs, size, SHA-256, header
        if: always()
        env:
          K: ${{ matrix.variant }}
        run: |
          mkdir -p dist
          o="$RUNNER_TEMP/work/project/output_files"
          ls -la "$o" || true
          cp "$o"/scan2.* dist/ 2>/dev/null || true
          rm -f dist/scan2.sof dist/scan2.pof
          test -f dist/scan2.rbf || { echo "::error::no scan2.rbf produced"; exit 1; }
          mv dist/scan2.rbf "dist/scan2_v$K.rbf"
          rbf="dist/scan2_v$K.rbf"
          size=$(stat -c %s "$rbf")
          sha=$(sha256sum "$rbf" | cut -d' ' -f1)
          {
            echo "### scan2_v$K.rbf (EP2C5F256C8)"
            echo "- size: $size bytes"
            echo "- sha256: \`$sha\`"
            echo '```'; od -A x -t x1 -N 64 "$rbf"; echo '```'
            echo "### fit.summary"; echo '```'; cat dist/scan2.fit.summary 2>/dev/null; echo '```'
            echo "### timing (sta.rpt worst slack)"; echo '```'
            grep -E "^; (Slow|Fast) Model (Setup|Hold|Recovery|Removal) Summary" -A 20 dist/scan2.sta.rpt 2>/dev/null | grep -E "^; clk" || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "== critical warnings"
          grep -h "^Critical Warning" dist/*.rpt || true
          echo "== warnings"
          grep -h "^Warning" dist/*.rpt || true
          echo "== ignored assignments (fit.rpt)"
          awk '/^; Ignored Assignments/{p=1} p&&/^$/{exit} p' dist/scan2.fit.rpt || true

      - name: Scan2 core gate (v${{ matrix.variant }})
        shell: bash
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.img.outputs.digest }}
          K: ${{ matrix.variant }}
        run: |
          rbf="dist/scan2_v$K.rbf"
          {
            echo "image: $IMAGE"
            echo "image digest: $DIGEST"
            echo "scan2_v$K.rbf size: $(stat -c %s "$rbf") bytes"
            echo "scan2_v$K.rbf sha256: $(sha256sum "$rbf" | cut -d' ' -f1)"
          } > gate.txt
          python3 tools/pinfind/ep2c5gate.py dist/scan2.pin --fit dist/scan2.fit.rpt \
            --scan2 "$K" --table "tools/pinfind/ep2c5_scan2_v$K.csv" \
            --base tools/pinfind/ep2c5_scan.csv --rbf "$rbf" | tee -a gate.txt
          { echo "### ep2c5gate --scan2 $K"; echo '```'; head -n 5 gate.txt; tail -n 40 gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing check (TimeQuest)
        # A bitstream that misses timing is not published either.
        run: |
          grep -E "^; (Slow|Fast) Model (Setup|Hold|Recovery|Removal) Summary" -A 16 \
            dist/scan2.sta.rpt | grep -E "^; clk" || true
          if grep -q "Timing requirements not met" dist/scan2.sta.rpt; then
            echo "::error::TimeQuest: timing requirements not met"; exit 1
          fi
          echo "timing met"

      - name: Upload bitstream
        # Only a bitstream that passed the gate and timing is published.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scan2-ep2c5-v${{ matrix.variant }}-rbf
          path: dist/scan2_v${{ matrix.variant }}.rbf
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan2-ep2c5-v${{ matrix.variant }}-reports
          path: |
            dist/*.summary
            dist/*.rpt
            dist/*.pin
            dist/*.smsg
            dist/*.done
            gate.txt
          if-no-files-found: ignore
