name: Build FPGA v55s (v55g + hardened MCU port, EP2C5F256)

# Builds fpga/v55s-ep2c5: v55g (fpga/v55g-ep2c5, see fpga-v55g-ep2c5.yaml)
# with the MCU -> core port synchronised / filtered and ADDR / DATA
# registered (v55s.v), weak pull-ups on MCU_ADDR[8:1] and MCU_RSTn
# (v55s.qsf). g1gate.v is v55g's file, used as is. Gated by
# tools/pinfind/ep2c5gate.py --v55g with tools/pinfind/ep2c5_v55s.csv (the
# v55g table with those pull-ups on). Icarus: tb_v55s (write / FIFO push /
# glitch checks) and tb_v55g's top checks run against v55s.
#
# ARTIFACTS ONLY: the .rbf is never committed. Not hardware-verified.

on:
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Quartus image to use. Default is this repository's own
          ghcr.io/<owner>/<repo>/quartus2:latest (lower-cased).
        required: false
        default: ''
  push:
    paths:
      - 'fpga/v55s-ep2c5/**'
      - 'fpga/v55g-ep2c5/g1gate.v'
      - 'fpga/v55g-ep2c5/tb/audio_pll_stub.v'
      - 'fpga/v55g-ep2c5/tb/tb_v55g.v'
      - 'fpga/amaranth/out/OpenGDEMUCore.v'
      - 'fpga/Quartus/ip/audio_pll/Audio_PLL.v'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/ep2c5_v55s.csv'
      - '.github/workflows/fpga-v55s-ep2c5.yaml'
  pull_request:
    paths:
      - 'fpga/v55s-ep2c5/**'
      - 'tools/pinfind/ep2c5_v55s.csv'
      - '.github/workflows/fpga-v55s-ep2c5.yaml'

jobs:
  unit-tests:
    name: Gate unit tests, v55s simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -m unittest -v tools/pinfind/tests/test_ep2c5gate.py \
            tools/pinfind/tests/test_ep2c5_pullcode.py tools/pinfind/tests/test_ep2c5_scan.py \
            tools/pinfind/tests/test_ep2c5_scan2.py tools/pinfind/tests/test_ep2c5_v55g.py
      - name: Icarus Verilog testbenches (v55s port, v55g top checks on v55s)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          C="fpga/v55g-ep2c5/tb/audio_pll_stub.v fpga/v55s-ep2c5/v55s.v fpga/v55g-ep2c5/g1gate.v fpga/amaranth/out/OpenGDEMUCore.v"
          iverilog -g2005 -o tbs.out fpga/v55s-ep2c5/tb/tb_v55s.v $C
          timeout 600 vvp -n tbs.out | tee tbs.txt
          grep -q '^TB PASS' tbs.txt
          sed 's/^    v55g dut (/    v55s dut (/' fpga/v55g-ep2c5/tb/tb_v55g.v > tb_top_s.v
          grep -q 'v55s dut' tb_top_s.v
          iverilog -g2005 -o tbt.out tb_top_s.v $C
          timeout 600 vvp -n tbt.out | tee tbt.txt
          grep -q '^TB PASS' tbt.txt
          { echo "### tb_v55s"; echo '```'; cat tbs.txt; echo '```';
            echo "### tb_v55g (top checks) on v55s"; echo '```'; cat tbt.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  quartus-compile:
    name: Quartus II 13.0 SP1 compile + gate (v55s)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Reclaim Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and pull image
        id: img
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/quartus2:latest"
          fi
          echo "Using $image"
          if ! docker pull "$image"; then
            image="ghcr.io/cepawiel/opengdemu/quartus2:latest"
            echo "Falling back to $image"
            docker pull "$image"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Quartus image"
            echo "- image: \`$image\`"
            echo "- resolved digest: \`$digest\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage sources
        run: |
          p="$RUNNER_TEMP/work/project"
          mkdir -p "$p"
          cp fpga/v55s-ep2c5/v55s.qpf fpga/v55s-ep2c5/v55s.qsf fpga/v55s-ep2c5/v55s.sdc \
             fpga/v55s-ep2c5/v55s.v fpga/v55g-ep2c5/g1gate.v \
             fpga/amaranth/out/OpenGDEMUCore.v fpga/Quartus/ip/audio_pll/Audio_PLL.v "$p/"

      - name: Compile (quartus_sh --flow compile)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/work:/build" \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -c 'cd /build/project && quartus_sh --flow compile v55s'

      - name: Collect outputs, size, SHA-256, LZMA size
        if: always()
        run: |
          mkdir -p dist
          o="$RUNNER_TEMP/work/project/output_files"
          ls -la "$o" || true
          cp "$o"/v55s.* dist/ 2>/dev/null || true
          rm -f dist/v55s.sof dist/v55s.pof
          test -f dist/v55s.rbf || { echo "::error::no v55s.rbf produced"; exit 1; }
          rbf=dist/v55s.rbf
          size=$(stat -c %s "$rbf")
          sha=$(sha256sum "$rbf" | cut -d' ' -f1)
          # The firmware's packer (mcu/netgd/build.rs): raw LZMA1, 4 KiB dictionary.
          lz=$(xz --format=raw --lzma1=preset=9e,dict=4KiB,lc=0,lp=0,pb=0 -c "$rbf" | wc -c)
          {
            echo "### v55s.rbf (EP2C5F256C8)"
            echo "- size: $size bytes (Quartus-compressed)"
            echo "- sha256: \`$sha\`"
            echo "- LZMA (build.rs filter): $lz bytes"
            echo '```'; od -A x -t x1 -N 64 "$rbf"; echo '```'
            echo "### fit.summary"; echo '```'; cat dist/v55s.fit.summary 2>/dev/null; echo '```'
            echo "### timing (sta.rpt worst slack)"; echo '```'
            grep -E "^; (Slow|Fast) Model (Setup|Hold|Recovery|Removal) Summary" -A 20 dist/v55s.sta.rpt 2>/dev/null | grep -E "^; [A-Za-z_]" | grep -v Summary || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$lz" > dist/v55s.lzma.size
          echo "== critical warnings"
          grep -h "^Critical Warning" dist/*.rpt || true
          echo "== warnings"
          grep -h "^Warning" dist/*.rpt || true
          echo "== ignored assignments (fit.rpt)"
          awk '/^; Ignored Assignments/{p=1} p&&/^$/{exit} p' dist/v55s.fit.rpt || true

      - name: v55s gate
        shell: bash
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          rbf=dist/v55s.rbf
          {
            echo "image: $IMAGE"
            echo "image digest: $DIGEST"
            echo "v55s.rbf size: $(stat -c %s "$rbf") bytes"
            echo "v55s.rbf sha256: $(sha256sum "$rbf" | cut -d' ' -f1)"
            echo "v55s.rbf LZMA (build.rs filter): $(cat dist/v55s.lzma.size) bytes"
          } > gate.txt
          python3 tools/pinfind/ep2c5gate.py dist/v55s.pin --fit dist/v55s.fit.rpt \
            --sta dist/v55s.sta.rpt --v55g --table tools/pinfind/ep2c5_v55s.csv \
            --rbf "$rbf" | tee -a gate.txt
          { echo "### ep2c5gate --v55g"; echo '```'; head -n 6 gate.txt; grep -E "^(note: (fit|sta)|FAIL|ep2c5gate)" gate.txt | head -n 120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing check (TimeQuest)
        run: |
          if grep -q "Timing requirements not met" dist/v55s.sta.rpt; then
            echo "::error::TimeQuest: timing requirements not met"; exit 1
          fi
          echo "timing met"

      - name: Upload bitstream
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v55s-ep2c5-rbf
          path: dist/v55s.rbf
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v55s-ep2c5-reports
          path: |
            dist/*.summary
            dist/*.rpt
            dist/*.pin
            dist/*.smsg
            dist/*.done
            dist/v55s.lzma.size
            gate.txt
          if-no-files-found: ignore
