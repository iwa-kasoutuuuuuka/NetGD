name: Build FPGA v55g (v5.5 core + g1gate, EP2C5F256)

# Builds fpga/v55g-ep2c5 (Run B / C image of docs/research/ag16k-ps-plan-run4.md):
# the unchanged v5.5 Amaranth core (fpga/amaranth/out/OpenGDEMUCore.v) with
# every Dreamcast G1 output behind g1gate.v, for EP2C5F256C8 with Quartus II
# 13.0 SP1. Pins are generated from tools/pinfind/ep2c5_padmap.csv by
# tools/pinfind/mk_v55g.py (a unit test checks the files are up to date).
# tools/pinfind/ep2c5gate.py --v55g gates the fitter's .pin / fit.rpt /
# sta.rpt (exact output set, 4 mA on every G1 output, pull-ups, PLL policy,
# timing). Icarus testbenches: g1gate alone (fault latch, expiry, DATA only
# inside AltStatus reads, ...) and the top with the real core.
# A bitstream is uploaded only if the gate and timing pass. The job also
# reports the firmware-side LZMA size (same xz filter as mcu/netgd/build.rs).
#
# ARTIFACTS ONLY: the .rbf is never committed. Not hardware-verified.
# Register map and safety design: docs/research/ep2c5-v55g.md.

on:
  workflow_dispatch:
    inputs:
      image:
        description: >-
          Quartus image to use. Default is this repository's own
          ghcr.io/<owner>/<repo>/quartus2:latest (lower-cased).
        required: false
        default: ''
  push:
    paths:
      - 'fpga/v55g-ep2c5/**'
      - 'fpga/amaranth/out/OpenGDEMUCore.v'
      - 'fpga/Quartus/ip/audio_pll/Audio_PLL.v'
      - 'fpga/stage0-ep2c5/stage0.qsf'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_v55g.py'
      - 'tools/pinfind/mk_scan.py'
      - 'tools/pinfind/ep2c5_v55g.csv'
      - 'tools/pinfind/ep2c5_padmap.csv'
      - 'tools/pinfind/ep2c5f256_balls.txt'
      - 'tools/pinfind/tests/test_ep2c5_v55g.py'
      - '.github/workflows/fpga-v55g-ep2c5.yaml'
  pull_request:
    paths:
      - 'fpga/v55g-ep2c5/**'
      - 'tools/pinfind/ep2c5gate.py'
      - 'tools/pinfind/mk_v55g.py'
      - '.github/workflows/fpga-v55g-ep2c5.yaml'

jobs:
  unit-tests:
    name: Gate + generator unit tests, g1gate / top simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: |
          python3 -m unittest -v tools/pinfind/tests/test_ep2c5gate.py \
            tools/pinfind/tests/test_ep2c5_pullcode.py tools/pinfind/tests/test_ep2c5_scan.py \
            tools/pinfind/tests/test_ep2c5_scan2.py tools/pinfind/tests/test_ep2c5_v55g.py
      - name: Icarus Verilog testbenches (g1gate, v55g top)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq iverilog
          iverilog -g2005 -o tbg.out fpga/v55g-ep2c5/tb/tb_g1gate.v fpga/v55g-ep2c5/g1gate.v
          timeout 600 vvp -n tbg.out | tee tbg.txt
          grep -q '^TB PASS' tbg.txt
          iverilog -g2005 -o tbv.out fpga/v55g-ep2c5/tb/tb_v55g.v \
            fpga/v55g-ep2c5/tb/audio_pll_stub.v fpga/v55g-ep2c5/v55g.v \
            fpga/v55g-ep2c5/g1gate.v fpga/amaranth/out/OpenGDEMUCore.v
          timeout 600 vvp -n tbv.out | tee tbv.txt
          grep -q '^TB PASS' tbv.txt
          { echo "### tb_g1gate"; echo '```'; cat tbg.txt; echo '```';
            echo "### tb_v55g"; echo '```'; cat tbv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  quartus-compile:
    name: Quartus II 13.0 SP1 compile + gate (v55g)
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Reclaim Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and pull image
        id: img
        env:
          INPUT_IMAGE: ${{ github.event.inputs.image }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$INPUT_IMAGE" ]; then
            image="$INPUT_IMAGE"
          else
            image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/quartus2:latest"
          fi
          echo "Using $image"
          if ! docker pull "$image"; then
            image="ghcr.io/cepawiel/opengdemu/quartus2:latest"
            echo "Falling back to $image"
            docker pull "$image"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "### Quartus image"
            echo "- image: \`$image\`"
            echo "- resolved digest: \`$digest\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stage sources
        run: |
          p="$RUNNER_TEMP/work/project"
          mkdir -p "$p"
          cp fpga/v55g-ep2c5/v55g.qpf fpga/v55g-ep2c5/v55g.qsf fpga/v55g-ep2c5/v55g.sdc \
             fpga/v55g-ep2c5/v55g.v fpga/v55g-ep2c5/g1gate.v \
             fpga/amaranth/out/OpenGDEMUCore.v fpga/Quartus/ip/audio_pll/Audio_PLL.v "$p/"

      - name: Compile (quartus_sh --flow compile)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          docker run --rm --user 0 \
            -v "$RUNNER_TEMP/work:/build" \
            --entrypoint /bin/bash \
            "$IMAGE" \
            -c 'cd /build/project && quartus_sh --flow compile v55g'

      - name: Collect outputs, size, SHA-256, LZMA size
        if: always()
        run: |
          mkdir -p dist
          o="$RUNNER_TEMP/work/project/output_files"
          ls -la "$o" || true
          cp "$o"/v55g.* dist/ 2>/dev/null || true
          rm -f dist/v55g.sof dist/v55g.pof
          test -f dist/v55g.rbf || { echo "::error::no v55g.rbf produced"; exit 1; }
          rbf=dist/v55g.rbf
          size=$(stat -c %s "$rbf")
          sha=$(sha256sum "$rbf" | cut -d' ' -f1)
          # The firmware's packer (mcu/netgd/build.rs): raw LZMA1, 4 KiB dictionary.
          lz=$(xz --format=raw --lzma1=preset=9e,dict=4KiB,lc=0,lp=0,pb=0 -c "$rbf" | wc -c)
          {
            echo "### v55g.rbf (EP2C5F256C8)"
            echo "- size: $size bytes (Quartus-compressed)"
            echo "- sha256: \`$sha\`"
            echo "- LZMA (build.rs filter): $lz bytes"
            echo '```'; od -A x -t x1 -N 64 "$rbf"; echo '```'
            echo "### fit.summary"; echo '```'; cat dist/v55g.fit.summary 2>/dev/null; echo '```'
            echo "### timing (sta.rpt worst slack)"; echo '```'
            grep -E "^; (Slow|Fast) Model (Setup|Hold|Recovery|Removal) Summary" -A 20 dist/v55g.sta.rpt 2>/dev/null | grep -E "^; [A-Za-z_]" | grep -v Summary || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$lz" > dist/v55g.lzma.size
          echo "== critical warnings"
          grep -h "^Critical Warning" dist/*.rpt || true
          echo "== warnings"
          grep -h "^Warning" dist/*.rpt || true
          echo "== ignored assignments (fit.rpt)"
          awk '/^; Ignored Assignments/{p=1} p&&/^$/{exit} p' dist/v55g.fit.rpt || true

      - name: v55g gate
        shell: bash
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          rbf=dist/v55g.rbf
          {
            echo "image: $IMAGE"
            echo "image digest: $DIGEST"
            echo "v55g.rbf size: $(stat -c %s "$rbf") bytes"
            echo "v55g.rbf sha256: $(sha256sum "$rbf" | cut -d' ' -f1)"
            echo "v55g.rbf LZMA (build.rs filter): $(cat dist/v55g.lzma.size) bytes"
          } > gate.txt
          python3 tools/pinfind/ep2c5gate.py dist/v55g.pin --fit dist/v55g.fit.rpt \
            --sta dist/v55g.sta.rpt --v55g --table tools/pinfind/ep2c5_v55g.csv \
            --rbf "$rbf" | tee -a gate.txt
          { echo "### ep2c5gate --v55g"; echo '```'; head -n 6 gate.txt; grep -E "^(note: (fit|sta)|FAIL|ep2c5gate)" gate.txt | head -n 120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Timing check (TimeQuest)
        run: |
          if grep -q "Timing requirements not met" dist/v55g.sta.rpt; then
            echo "::error::TimeQuest: timing requirements not met"; exit 1
          fi
          echo "timing met"

      - name: Upload bitstream
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v55g-ep2c5-rbf
          path: dist/v55g.rbf
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v55g-ep2c5-reports
          path: |
            dist/*.summary
            dist/*.rpt
            dist/*.pin
            dist/*.smsg
            dist/*.done
            dist/v55g.lzma.size
            gate.txt
          if-no-files-found: ignore
