name: FPGA stage-0 (EP2C5F256)

# Builds fpga/stage0-ep2c5: a Cyclone II EP2C5F256C8 image with no logic and
# every unused pin as an input, for the first full configuration of the
# GDEMU 6.0 FPGA (the chip accepts EP2C5 streams). Then checks the fitter's
# .pin report with check_pins.py. Nothing here is hardware-verified; this
# only builds and checks the image. Loading it is a separate decision.

on:
  workflow_dispatch:
  push:
    paths:
      - 'fpga/stage0-ep2c5/**'
      - '.github/workflows/stage0-ep2c5.yaml'
  pull_request:
    paths:
      - 'fpga/stage0-ep2c5/**'
      - '.github/workflows/stage0-ep2c5.yaml'

jobs:
  stage0:
    name: Quartus II 13.0 SP1 stage-0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Checker tests
        run: cd fpga/stage0-ep2c5 && python3 -m unittest discover -s tests -v

      - name: Reclaim Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same image choice as fpga.yaml.
      - name: Resolve and pull image
        id: img
        env:
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/quartus2:latest"
          if ! docker pull "$image"; then
            image="ghcr.io/cepawiel/opengdemu/quartus2:latest"
            echo "Falling back to $image"
            docker pull "$image"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Compile (quartus_sh --flow compile)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cp fpga/stage0-ep2c5/stage0.qpf fpga/stage0-ep2c5/stage0.qsf fpga/stage0-ep2c5/stage0.v "$RUNNER_TEMP/work/"
          docker run --rm --user 0 -v "$RUNNER_TEMP/work:/build" --entrypoint /bin/bash \
            "$IMAGE" -c "cd /build && quartus_sh --flow compile stage0"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist
          o="$RUNNER_TEMP/work/output_files"
          ls -la "$o" || true
          cp "$o"/stage0.* dist/ 2>/dev/null || true

      - name: Check pins (nothing driven)
        run: python3 fpga/stage0-ep2c5/check_pins.py dist/stage0.pin

      - name: Summary
        if: always()
        run: |
          {
            echo "### stage0.rbf"
            if [ -f dist/stage0.rbf ]; then
              echo "- size: $(stat -c %s dist/stage0.rbf) bytes (OpenGDEMU.rbf: $(stat -c %s fpga/Quartus/output_files/OpenGDEMU.rbf))"
              echo "- sha256: \`$(sha256sum dist/stage0.rbf | cut -d' ' -f1)\`"
              echo "- first 48 bytes: \`$(head -c 48 dist/stage0.rbf | od -An -tx1 | tr -d ' \n')\`"
              echo "- OpenGDEMU.rbf first 48 bytes: \`$(head -c 48 fpga/Quartus/output_files/OpenGDEMU.rbf | od -An -tx1 | tr -d ' \n')\`"
            else
              echo "- no stage0.rbf produced"
            fi
            echo "### pin check"; echo '```'; python3 fpga/stage0-ep2c5/check_pins.py dist/stage0.pin 2>&1 || true; echo '```'
            echo "### asm (compression, options)"; echo '```'; grep -i -E 'compress|reserve|unused|nCEO|INIT_DONE|Configuration' dist/stage0.asm.rpt 2>/dev/null | head -40; echo '```'
            echo "### fit.summary"; echo '```'; cat dist/stage0.fit.summary 2>/dev/null; echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload image and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage0-ep2c5
          path: |
            dist/stage0.rbf
            dist/stage0.pin
            dist/*.rpt
            dist/*.summary
          if-no-files-found: ignore
