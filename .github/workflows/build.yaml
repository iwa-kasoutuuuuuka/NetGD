name: Build and Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: Firmware (thumbv7m-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mcu/netgd/rust-toolchain.toml selects stable + thumbv7m-none-eabi;
      # installing it explicitly here keeps the first cargo call from doing it.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      # build.rs shells out to `xz` to LZMA-pack the FPGA bitstream.
      - name: Ensure xz
        run: command -v xz || (sudo apt-get update && sudo apt-get install -y xz-utils)

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mcu/netgd
            mcu/fwupdater

      # build.rs builds fwupdater itself into OUT_DIR; the standalone build
      # below catches an updater breakage with a clearer error.
      - name: Build fwupdater
        working-directory: mcu/fwupdater
        run: cargo build --release

      - name: Build netgd
        working-directory: mcu/netgd
        run: cargo build --release

      - name: Upload firmware ELF
        uses: actions/upload-artifact@v4
        with:
          name: netgd-elf
          path: mcu/netgd/target/thumbv7m-none-eabi/release/netgd
          if-no-files-found: error

      # The resident-boot layout (app linked at 0x82000, `.app_desc`,
      # `.image_crc`) must keep linking on both parts. After the upload above:
      # these overwrite the ELF in the shared target directory.
      - name: Build netgd (resident layout, 4E)
        working-directory: mcu/netgd
        run: cargo build --release --features resident

      - name: Build netgd (resident layout, 2E / board-v60)
        working-directory: mcu/netgd
        env:
          DEFMT_LOG: "off"
        run: cargo build --release --no-default-features --features board-v60,resident

      # The tightest fit: 2E with the v5.5 bitstream, the resident layout and
      # the speed features (LOG R81). Fails here first if the app outgrows
      # the 122,880-byte app area. Since the R105 bitstream (LOG R111) it only
      # fits with the opt-in size profile `release-z` (LOG R98); its speed is
      # not yet compared on hardware.
      - name: Build netgd (2E, resident, sd-fast, release-z)
        working-directory: mcu/netgd
        env:
          DEFMT_LOG: "off"
        run: cargo build --profile release-z --features sam3u2e,resident,sd-fast

      # The 2E image that is actually distributed (no resident layout).
      - name: Build netgd (2E)
        working-directory: mcu/netgd
        env:
          DEFMT_LOG: "off"
        run: cargo build --release --features sam3u2e

  host-tests:
    name: Host tests (lzma, gamecfg, discimg, psload, bootcore, sdfast, fatmap, fwupdater)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: common/lzma
          - crate: common/gamecfg
          - crate: common/discimg
          - crate: common/psload
          - crate: mcu/bootcore
          - crate: common/sdfast
          - crate: common/fatmap
          # .cargo/config.toml defaults to thumbv7m-none-eabi, so the host
          # target has to be named explicitly.
          - crate: mcu/fwupdater
            args: --lib --target x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: cargo test
        working-directory: ${{ matrix.crate }}
        run: cargo test ${{ matrix.args }}

  gdprobe-host:
    name: gdprobe host tests (C + compare.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The KOS parts (main.c, gdraw.c) need DreamSDK and are not built here;
      # this covers the record format, whitelist, chunked /pc/ writer, runner
      # and the PC-side compare script.
      - name: Run host tests
        working-directory: tools/gdprobe
        run: sh tests/run_tests.sh

  tools-host:
    name: Tools host tests (${{ matrix.tool }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Read only by tools/fwbackup: runs its tests without a real probe.
      FWBACKUP_TEST_WRAPPER: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard library only. mksdcard's tests do not call cargo (only
          # verify.py does), so no Rust toolchain is needed here.
          - tool: mksdcard
            dir: tools/mksdcard
            cmd: python tests/test_mksdcard.py
          - tool: netgd-send
            dir: tools/netgd-send
            cmd: python -m unittest discover -s tests -v
          # About 150 s.
          - tool: fwbackup
            dir: tools/fwbackup
            cmd: python -m unittest discover -s tests -p "test_*.py"
          # The real-ELF cases skip unless FWIMAGE_ELF_4E / FWIMAGE_ELF_2E are set.
          - tool: fwimage
            dir: .
            cmd: python -m unittest discover -s tools/fwimage -v
          # Needs gcc (preinstalled on ubuntu-latest), about 15 s (full sweep, CI=true).
          - tool: netgd-recv
            dir: .
            cmd: python tools/netgd-recv/test/run_tests.py
          # Needs gcc.  The menu core, linked with the netgd-recv core (docs/design/menu-app.md 11).
          - tool: netgd-menu
            dir: .
            cmd: python tools/netgd-menu/test/run_tests.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # netgd-recv's tests are skipped until tools/netgd-recv/test exists in
      # the checkout; every other entry always runs.
      - name: Run tests
        if: ${{ matrix.tool != 'netgd-recv' || hashFiles('tools/netgd-recv/test/run_tests.py') != '' }}
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}

  fpga-sim:
    name: FPGA simulation and Verilog check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fpga/amaranth
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep in sync with fpga/amaranth/Containerfile: both versions decide the
      # generated Verilog (the yosys version is stamped into its banner).
      - name: Install Amaranth
        run: pip install "amaranth==0.5.8" "amaranth-yosys==0.50.0.0.post123"

      - name: Simulations
        env:
          AMARANTH_USE_YOSYS: builtin
        run: |
          python test.py
          python test_cdda.py
          python test_timing.py
          python test_top.py

      # The generated Verilog is committed and fed to Quartus, so it must
      # match what main.py produces from the sources.
      - name: Regenerate Verilog and check it is committed
        env:
          AMARANTH_USE_YOSYS: builtin
        run: |
          python main.py
          git diff --exit-code -- out/OpenGDEMUCore.v

      # AG16K (GDEMU 6.0) target: same simulations against the block-RAM
      # FIFOs, the lockstep equivalence test, and the generated Verilog check.
      - name: Simulations (ag16k target)
        env:
          AMARANTH_USE_YOSYS: builtin
          NETGD_FPGA_TARGET: ag16k
        run: |
          python test.py
          python test_cdda.py
          python test_timing.py
          python test_top.py

      - name: FIFO equivalence (cyclone2 vs ag16k)
        env:
          AMARANTH_USE_YOSYS: builtin
        run: python test_fifo.py

      - name: Regenerate ag16k Verilog and check it is committed
        env:
          AMARANTH_USE_YOSYS: builtin
        run: |
          python main.py --target ag16k
          git diff --exit-code -- out/OpenGDEMUCore_ag16k.v
